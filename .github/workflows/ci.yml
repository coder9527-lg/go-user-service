name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 支持在 GitHub 网页 Actions 页或用 gh workflow run 手动触发
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Build
        run: go build -trimpath -o /tmp/go-user-service .
