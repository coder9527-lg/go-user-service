# 本地联调用：一条命令拉起应用 + MySQL
# 用法：docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: go-user-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: go-user-service
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: go-user-service-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DRIVER: mysql
      DB_HOSTNAME: mysql
      DB_PORT: "3306"
      DB_USERNAME: app
      DB_PASSWORD: apppass
      DB_DBNAME: go-user-service
      JWT_SECRET: please-change-this-secret
      GIN_MODE: release
    ports:
      - "8080:8080"

volumes:
  mysql-data:
